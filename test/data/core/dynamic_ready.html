<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../jquery.js"></script>
	<script>var $j = jQuery.noConflict();</script>
</head>
<body>
<iframe id="dont_return" src="dont_return.php"></iframe>
<script>
	var timeoutId, $,
		timeoutFired = false;

	setTimeout(function () {
		// Load another jQuery copy using the first one.
		$j.getScript( "../../../dist/jquery.js", function () {
			$j( "#dont_return" ).attr( "src", "about:blank" );

			// document ready handled by the just-loaded jQuery copy.
			$(function () {
				clearTimeout( timeoutId );
				if ( !timeoutFired ) {
					window.parent.iframeCallback( true );
				}
			});
		});

		// Raised from the upstream 10s. This watchdog is independent of
		// QUnit.config.testTimeout, so it alone decided the outcome of #13655. The
		// sibling <iframe src="dont_return.php"> parks a PHP worker for 30s while this
		// page also pulls the 283KB dist/jquery.js, and on a resource-constrained CI
		// container that pair intermittently exceeded 10s -- the watchdog then reported
		// a spurious "not ready". Kept below QUnit's 60s testTimeout so this page still
		// reports a real result rather than being cut off by QUnit.
		timeoutId = setTimeout(function () {
			timeoutFired = true;
			window.parent.iframeCallback( false );
		}, 45000);
	});
</script>
</body>
</html>
